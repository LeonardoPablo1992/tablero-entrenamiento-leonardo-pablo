<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonardo Pablo — Programa de Entrenamiento</title>
<style>
  
  
  
  
  :root{ --bg:#ffffff; --bg-2:#f3fbf7; --panel:#ffffff; --panel-2:#eef8f2; --stripe:#fafdfb; --border:#cfe9db; --border-soft:#e4f3ea; --text:#10231a; --text-dim:#55675e; --text-faint:#8a9a91; --jade:#00a86b; --jade-deep:#08804f; --jade-ink:#0a4f39; --jade-soft:#e3f6ec; --mint:#9fdcbd; --white:#10231a; --accent:#00a86b; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Red Hat Display', Arial, Helvetica, sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}

  header.top{
    background:linear-gradient(180deg,#f3fbf7 0%, #ffffff 100%);
    border-bottom:1px solid var(--border);
    padding:36px 0 0 0;
  }
  .brand-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;padding-bottom:24px;}
  .brand-title{
    font-weight:900;
    font-size:clamp(28px,4vw,44px);
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--white);
    margin:0;
  }
  .brand-sub{color:var(--text-dim);font-weight:500;font-size:14px;margin-top:6px;letter-spacing:0.3px;}
  .brand-tag{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-faint);
    font-weight:700;
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
  }
  .kpis{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:24px;}
  .kpi{
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:10px 16px;
    min-width:120px;
    animation:kpi-in .45s ease both;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .kpi:hover{transform:translateY(-2px);border-color:var(--border);background:var(--panel-2);}
  .kpi .k-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);font-weight:700;}
  .kpi .k-value{font-size:17px;font-weight:800;color:var(--white);margin-top:3px;}
  @keyframes kpi-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  nav.tabs{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:0 0 0 0;
    border-bottom:1px solid var(--border);
    background:#232324;
    position:sticky;
    top:0;
    z-index:50;
    scrollbar-width:thin;
  }
  nav.tabs .tab-inner{display:flex;gap:4px;padding:0 20px;max-width:1180px;margin:0 auto;width:100%;}
  nav.tabs button{
    appearance:none;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    padding:14px 16px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:3px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--white);border-bottom-color:var(--white);}

  main{padding:28px 0 60px 0;min-height:50vh;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .section-title{
    font-size:20px;
    font-weight:800;
    color:var(--white);
    margin:0 0 4px 0;
    letter-spacing:0.2px;
  }
  .section-desc{color:var(--text-dim);font-size:13.5px;margin:0 0 18px 0;max-width:760px;}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px;}
  @media (max-width:860px){.grid-2{grid-template-columns:1fr;}}

  .card{
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:18px 20px;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--border);box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .card h3{margin:0 0 4px 0;font-size:14px;color:var(--white);font-weight:800;letter-spacing:0.3px;text-transform:uppercase;}
  .card p{margin:0;color:var(--text-dim);font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    background:var(--panel-2);
    color:var(--white);
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:0.8px;
    font-weight:800;
    padding:10px 10px;
    border-bottom:1px solid var(--border);
    text-align:left;
    white-space:nowrap;
  }
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid var(--border-soft);
    color:var(--text);
    vertical-align:top;
  }
  tbody tr:nth-child(even){background:var(--stripe);}
  tbody tr.cat-row td{
    background:var(--panel-2);
    color:var(--white);
    font-weight:800;
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:1px;
    padding:8px 10px;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  .muted{color:var(--text-faint);}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .table-scroll{overflow-x:auto;border:1px solid var(--border-soft);border-radius:12px;}
  .table-scroll table{min-width:760px;}
  .table-scroll.wide table{min-width:980px;}

  .chip-total{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-dim);
  }
  .chip-total b{color:var(--white);font-size:14px;}
  .totals-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px 0;}

  .muscle-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:6px;}

  .chart-box{background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:16px;height:260px;}

  .bars{display:flex;align-items:stretch;justify-content:space-around;gap:16px;height:228px;}
  .bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%;}
  .bar-track{display:flex;align-items:flex-end;width:100%;max-width:64px;height:190px;}
  .bar-fill{width:100%;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;min-height:4px;position:relative;transition:height .3s ease;}
  .bar-value{position:absolute;top:-22px;font-size:12px;font-weight:700;color:var(--text);}
  .bar-label{margin-top:10px;font-size:12px;font-weight:600;color:var(--text-dim);}

  .legend-note{font-size:12px;color:var(--text-faint);margin-top:10px;}
  .legend-note b{color:var(--text-dim);}

  .week-pills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 18px 0;}
  .week-pill{
    appearance:none;cursor:pointer;font-family:inherit;text-align:left;
    background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;
    padding:9px 16px;color:var(--text-dim);
    transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
  }
  .week-pill:hover{transform:translateY(-2px);border-color:var(--border);}
  .week-pill .wp-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
  .week-pill .wp-sub{display:block;font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .week-pill .wp-series{display:block;font-size:15px;font-weight:800;color:var(--white);margin-top:4px;}
  .week-pill.active{background:var(--white);border-color:var(--white);color:#ffffff;}
  .week-pill.active .wp-sub{color:#55675e;}
  .week-pill.active .wp-series{color:#ffffff;}

  .cat-block-label{
    font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
    color:var(--text-faint);margin:18px 0 10px 0;
  }
  .cat-block-label:first-child{margin-top:0;}

  .ex-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .ex-card{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;
    padding:14px 16px;cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    animation:card-in .35s ease both;
  }
  .ex-card:hover{transform:translateY(-3px);border-color:var(--border);background:var(--panel-2);}
  .ex-card .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ex-card .combo-badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
    border-radius:6px;background:var(--panel-2);border:1px solid var(--border-soft);
    font-size:11px;font-weight:800;color:var(--text-dim);padding:0 6px;
  }
  .ex-card h4{margin:8px 0 2px 0;font-size:14px;color:var(--white);font-weight:800;line-height:1.3;}
  .ex-card .setsreps{font-size:22px;font-weight:900;color:var(--white);margin:6px 0;font-variant-numeric:tabular-nums;}
  .ex-card .ex-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-faint);border-top:1px dashed var(--border-soft);padding-top:8px;margin-top:4px;max-height:0;overflow:hidden;transition:max-height .2s ease, padding .2s ease, margin .2s ease;}
  .ex-card.open .ex-meta{max-height:60px;}
  .ex-card .ex-meta span b{color:var(--text-dim);font-weight:700;}
  .ex-card .ex-hint{font-size:10px;color:var(--text-faint);margin-top:6px;letter-spacing:.3px;}
  @keyframes card-in{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}

  tbody tr.ex-row{cursor:pointer;transition:background .12s ease;}
  tbody tr.ex-row:hover{background:var(--panel-2);}
  tbody tr.ex-row td.num-cell{font-weight:700;color:var(--white);}
  tbody tr.ex-row td.num-cell.off{color:var(--text-faint);font-weight:400;}
  tbody tr.ex-meta-row{display:none;}
  tbody tr.ex-meta-row.show{display:table-row;}
  tbody tr.ex-meta-row td{background:var(--panel-2);padding:8px 10px;border-bottom:1px solid var(--border-soft);}
  .ex-meta-inline{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--text-faint);}
  .ex-meta-inline b{color:var(--text-dim);font-weight:700;}
  .ex-row .combo-badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
    border-radius:6px;background:var(--panel-2);border:1px solid var(--border-soft);
    font-size:11px;font-weight:800;color:var(--text-dim);padding:0 6px;
  }
  .ex-row .ex-name-cell{display:flex;align-items:center;gap:4px;}
  .ex-row .ex-caret{font-size:10px;color:var(--text-faint);transition:transform .15s ease;}
  .ex-row.open .ex-caret{transform:rotate(90deg);}
  .ex-check-cell{width:34px;}
  .ex-check{
    appearance:none;-webkit-appearance:none;margin:0;cursor:pointer;
    width:20px;height:20px;border-radius:5px;border:1.5px solid var(--text-faint);
    background:transparent;display:inline-grid;place-content:center;vertical-align:middle;
    transition:background .12s ease, border-color .12s ease;
  }
  .ex-check:hover{border-color:var(--white);}
  .ex-check::after{content:"";width:10px;height:6px;border-left:2.5px solid #ffffff;border-bottom:2.5px solid #ffffff;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .12s ease;}
  .ex-check:checked{background:var(--white);border-color:var(--white);}
  .ex-check:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1);}
  .ex-check:focus-visible{outline:2px solid var(--white);outline-offset:2px;}
  .wk-check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;}
  .wk-check .ex-check{width:18px;height:18px;flex:0 0 auto;}
  tbody tr.ex-row td.num-cell.done .num{color:var(--text-faint);text-decoration:line-through;font-weight:400;}
  .check-count{display:inline-flex;gap:8px;flex-wrap:wrap;}
  .wk-count{border:1px solid var(--border-soft);border-radius:999px;padding:4px 10px;font-size:11px;letter-spacing:.3px;}
  .wk-count.full{border-color:var(--white);color:var(--white);}
  .check-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 0 0;font-size:12px;color:var(--text-dim);}
  .check-bar b{color:var(--white);}
  .check-reset{background:transparent;border:1px solid var(--border-soft);color:var(--text-dim);border-radius:999px;padding:5px 12px;font:inherit;font-size:11px;letter-spacing:.3px;cursor:pointer;}
  .check-reset:hover{border-color:var(--border);color:var(--white);}

  .super-chart{position:relative;height:280px;}
  .super-chart svg{width:100%;height:100%;overflow:visible;}
  .super-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-dim);}
  .super-legend .lg-item{display:flex;align-items:center;gap:6px;}
  .super-legend .lg-swatch{width:14px;height:4px;border-radius:2px;display:inline-block;}

  footer.site{
    border-top:1px solid var(--border);
    background:#f6faf8;
    padding:26px 0;
    text-align:center;
  }
  footer.site .foot-name{font-weight:800;color:var(--white);letter-spacing:0.3px;}
  footer.site .foot-sub{color:var(--text-faint);font-size:12px;margin-top:4px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#55675e;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

/* ===== ProTrainerPlus · capa de diseño (blanco, líneas verdes, botones redondos verde claro) ===== */
:root{--ptp-bg:#ffffff;--ptp-alt:#f6faf8;--ptp-line:#cfe9db;--ptp-line-soft:#e4f3ea;--ptp-green:#00a86b;--ptp-deep:#08804f;--ptp-ink:#0a4f39;--ptp-soft:#e3f6ec;--ptp-mint:#9fdcbd;--ptp-btn:#a8ecc8;--ptp-btn-h:#8be3b5;--ptp-text:#10231a;--ptp-dim:#55675e;--ptp-shadow:0 1px 2px rgba(10,79,57,.05),0 8px 24px -12px rgba(10,79,57,.18)}
html,body{background:#fff!important}
body{font-family:"Red Hat Display",system-ui,sans-serif!important;color:var(--ptp-text)}
body *{font-family:"Red Hat Display",system-ui,sans-serif!important}

/* encabezados con líneas verdes animadas */
header.top,header.topbar,.ptp-hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#f3fbf7 0,#fff 100%)!important;border-bottom:1px solid var(--ptp-line)!important;color:var(--ptp-text)!important}
header.top>*,header.topbar>*{position:relative;z-index:1}
.hdr-lines{position:absolute!important;inset:0;width:100%;height:100%;pointer-events:none;z-index:0!important}
.hdr-lines path{fill:none;stroke:var(--ptp-green);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:6 10;animation:ptpflow 14s linear infinite}
.hdr-lines path:nth-child(2){stroke:var(--ptp-mint);stroke-dasharray:none;stroke-width:1.5;animation:ptpsway 9s ease-in-out infinite alternate}
.hdr-lines path:nth-child(3){stroke-dasharray:2 8;animation-duration:22s;opacity:.6}
@keyframes ptpflow{to{stroke-dashoffset:-320}}
@keyframes ptpsway{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
.brand-title,.brand h1,.plan-title{font-family:"Red Hat Display",system-ui,sans-serif!important;font-weight:600!important;letter-spacing:-.6px!important;text-transform:none!important;color:var(--ptp-text)!important}
.brand-sub,.brand p{color:var(--ptp-dim)!important;opacity:1!important}
.brand-tag,.athlete-chip,.week-chip{background:#fff!important;color:var(--ptp-ink)!important;border:1px solid var(--ptp-line)!important;border-radius:999px!important;letter-spacing:.2px!important;text-transform:none!important;font-size:12.5px!important;font-weight:600!important}
.brand-watermark{opacity:.08!important}

/* indicadores */
.kpi,.kpi-card,.objective-card,.totals-card{background:#fff!important;border:1px solid var(--ptp-line)!important;border-radius:18px!important;box-shadow:var(--ptp-shadow)!important}
.kpi{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px!important}
.kpi .k-ico{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--ptp-soft);display:grid;place-items:center;color:var(--ptp-deep)}
.kpi .k-label,.kpi-card .label{text-transform:none!important;letter-spacing:0!important;font-size:12px!important;color:var(--ptp-dim)!important;font-weight:500!important}
.kpi .k-value,.kpi-card .value{color:var(--ptp-text)!important}

/* pestañas: píldoras */
nav.tabs,.tabs{background:rgba(255,255,255,.95)!important;backdrop-filter:blur(10px);border-bottom:1px solid var(--ptp-line)!important;scrollbar-width:none}
nav.tabs .tab-inner{gap:8px!important;padding-top:12px!important;padding-bottom:12px!important}
header.topbar nav.tabs{background:transparent!important;border-bottom:none!important;padding:6px 0 16px;gap:8px!important}
nav.tabs button,.tab-btn{display:inline-flex!important;align-items:center;gap:8px;background:#fff!important;border:1px solid var(--ptp-line)!important;color:var(--ptp-dim)!important;opacity:1!important;font-family:"Red Hat Display",system-ui,sans-serif!important;font-size:14px!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;padding:9px 18px!important;border-radius:999px!important;margin:0!important;transition:background .15s,color .15s,border-color .15s}
nav.tabs button:hover,.tab-btn:hover{background:var(--ptp-soft)!important;color:var(--ptp-ink)!important;border-color:var(--ptp-mint)!important}
nav.tabs button.active,.tab-btn[aria-selected="true"]{background:var(--ptp-btn)!important;border-color:var(--ptp-btn)!important;color:#06402b!important;font-weight:600!important;box-shadow:0 6px 16px -10px rgba(0,168,107,.8)}
.tab-btn[aria-selected="true"]::after{display:none!important}
.tabs{display:flex;gap:8px!important;padding:10px 2px 12px!important}
nav.tabs button .tab-done{background:var(--ptp-green)!important;color:#fff!important;border-radius:50%!important}

/* títulos y tarjetas */
.section-title,h2.section-title{color:var(--ptp-text)!important;font-weight:600!important;letter-spacing:-.3px!important;text-transform:none!important;display:flex;align-items:center;gap:10px}
.section-title:before,h2.section-title:before{content:"";width:4px;height:20px;border-radius:4px;background:var(--ptp-green);flex:0 0 auto}
.card,.meal-card,.list-card,.ex-card,.chart-box{background:#fff!important;border:1px solid var(--ptp-line)!important;border-radius:18px!important;box-shadow:var(--ptp-shadow)!important}
.card:hover{transform:none!important}
.card h3,h3.card-title,.meal-card h4{color:var(--ptp-text)!important;text-transform:none!important;letter-spacing:-.1px!important;font-weight:600!important;display:flex;align-items:center;gap:8px}
.cat-block-label{color:var(--ptp-deep)!important;text-transform:none!important;letter-spacing:.1px!important;font-weight:700!important;display:flex;align-items:center;gap:10px}
.cat-block-label:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ptp-mint),transparent)}
.table-scroll{border:1px solid var(--ptp-line)!important;border-radius:18px!important;background:#fff!important;box-shadow:var(--ptp-shadow)}
thead th,table.data-table th{background:var(--ptp-soft)!important;color:var(--ptp-ink)!important;text-transform:none!important;letter-spacing:0!important;font-size:12.5px!important;border-bottom:1px solid var(--ptp-line)!important}
tbody tr.cat-row td{background:var(--ptp-soft)!important;color:var(--ptp-ink)!important;text-transform:none!important;letter-spacing:0!important}

/* botones verdes claros y redondos */
button,.check-reset,.filter-btn,.phase-btn,.week-pill,.month-switch button,.day-chips button{border-radius:999px!important}
.check-reset,.filter-btn,.month-switch button,.day-chips button,.phase-btn{background:#fff!important;border:1px solid var(--ptp-mint)!important;color:var(--ptp-ink)!important;font-family:inherit!important;font-weight:600!important;cursor:pointer;transition:background .15s,transform .15s}
.check-reset:hover,.filter-btn:hover,.month-switch button:hover,.day-chips button:hover,.phase-btn:hover{background:var(--ptp-soft)!important;transform:translateY(-1px)}
.filter-btn.active,.month-switch button.on,.day-chips button.on,.phase-btn.active,.week-pill.active{background:var(--ptp-btn)!important;border-color:var(--ptp-btn)!important;color:#06402b!important}
.week-pill{background:#fff!important;border:1px solid var(--ptp-line)!important;color:var(--ptp-text)!important}
.week-pill.active .wp-sub,.week-pill.active .wp-series{color:#06402b!important}
.phase-btn{padding:10px 18px!important;text-align:left}
.month-switch{border-radius:999px!important}

/* casillas redondas */
.ex-check{border-radius:50%!important;border-color:var(--ptp-mint)!important;background:#fff!important}
.ex-check:checked{background:var(--ptp-green)!important;border-color:var(--ptp-green)!important}
.ex-check::after{border-color:#fff!important}

}

function activateTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===id));

}

// Generic count-up: animates the leading number inside a value string, keeps any prefix/suffix text intact.
function animateCounts(scope){
  scope.querySelectorAll('[data-count]').forEach(el=>{
    const raw = el.dataset.count;
    const m = raw.match(/([\d.,]*\d)/);
    if(!m){ return; }
    const numText = m[1];
    const target = parseFloat(numText.replace(/,/g,''));
    if(isNaN(target)){ return; }
    const before = raw.slice(0, m.index);
    const after = raw.slice(m.index + numText.length);
    const decimals = (numText.split('.')[1] || '').length;
    const hasThousands = numText.includes(',');
    const dur = 700, start = performance.now();
    function tick(now){
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = target * eased;
      let text = val.toFixed(decimals);
      if(hasThousands){
        const parts = text.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        text = parts.join('.');
      }
      el.textContent = before + text + after;
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function smoothPathD(pts){
  if(pts.length<2) return '';
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const x0=pts[i][0], y0=pts[i][1], x1=pts[i+1][0], y1=pts[i+1][1];
    const mx=(x0+x1)/2;
    d += ` C ${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return d;
}

function renderProgresion(){
  // Carga (estímulo) real: promedio de series de músculo principal entre los 6 grupos musculares, por semana.
  const weeks = ['S1','S2','S3','S4'];
  const avgLoad = {};
  weeks.forEach(wk=>{
    const vals = Object.values(DATA.totals).map(t=>t[wk]);
    avgLoad[wk] = vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  // Rendimiento / supercompensación: modelo ilustrativo derivado de la carga real (a mayor carga acumulada,
  // mayor fatiga y caída temporal de rendimiento; al reducir carga, el rendimiento se recupera por encima
  // de la línea base — el efecto de supercompensación).
  const perf = {};
  perf.S1 = 100;
  perf.S2 = perf.S1 - (avgLoad.S2 - avgLoad.S1) * 0.6;
  perf.S3 = perf.S2 - (avgLoad.S3 - avgLoad.S2) * 0.6;
  perf.S4 = perf.S3 + (avgLoad.S3 - avgLoad.S4) * 0.5;
  const perfRec = 100 + (100 - perf.S3) * 0.5;

  const labels = ['Semana 1','Semana 2','Semana 3','Semana 4','Recuperación'];
  const loadVals = [avgLoad.S1, avgLoad.S2, avgLoad.S3, avgLoad.S4, avgLoad.S1 * 0.85];
  const perfVals = [perf.S1, perf.S2, perf.S3, perf.S4, perfRec];

  const W = 640, H = 260, padL = 34, padR = 16, padT = 20, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = labels.length;
  const xAt = i => padL + (plotW * i)/(n-1);

  const allVals = [...loadVals, ...perfVals];
  const vMin = Math.min(...allVals) - 4, vMax = Math.max(...allVals) + 4;
  const yAt = v => padT + plotH - ((v - vMin)/(vMax - vMin)) * plotH;

  const loadPts = loadVals.map((v,i)=>[xAt(i), yAt(v)]);
  const perfPts = perfVals.map((v,i)=>[xAt(i), yAt(v)]);

  const loadPath = smoothPathD(loadPts);
  const perfPath = smoothPathD(perfPts);
  const baseY = padT + plotH;
  const loadArea = `${loadPath} L ${loadPts[loadPts.length-1][0].toFixed(1)},${baseY} L ${loadPts[0][0].toFixed(1)},${baseY} Z`;
  const perfArea = `${perfPath} L ${perfPts[perfPts.length-1][0].toFixed(1)},${baseY} L ${perfPts[0][0].toFixed(1)},${baseY} Z`;

  const loadDots = loadPts.map(([x,y],i)=>`
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#0a4f39" stroke="#ffffff" stroke-width="1.5"/>
    <text x="${x.toFixed(1)}" y="${(y-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#0a4f39">${loadVals[i].toFixed(0)}</text>
  `).join('');
  const perfDots = perfPts.map(([x,y])=>`
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#00a86b" stroke="#ffffff" stroke-width="1.5"/>
  `).join('');
  const xLabels = labels.map((l,i)=>`
    <text x="${xAt(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#96969a">${l}</text>
  `).join('');

  const svg = `
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="loadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9fdcbd" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#9fdcbd" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="perfGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#00a86b" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#00a86b" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="${padL}" y1="${yAt(100).toFixed(1)}" x2="${W-padR}" y2="${yAt(100).toFixed(1)}" stroke="#5a5a5e" stroke-width="1" stroke-dasharray="3,4"/>
    <path d="${loadArea}" fill="url(#loadGrad)" stroke="none"/>
    <path d="${perfArea}" fill="url(#perfGrad)" stroke="none"/>
    <path d="${loadPath}" fill="none" stroke="#9fdcbd" stroke-width="2.5"/>
    <path d="${perfPath}" fill="none" stroke="#00a86b" stroke-width="2.5" stroke-dasharray="6,5"/>
    ${loadDots}
    ${perfDots}
    ${xLabels}
  </svg>`;

  return `
  <h2 class="section-title">Progresión &middot; ciclo de supercompensación</h2>
  <p class="section-desc">Carga real de entrenamiento (promedio de series de músculo principal entre los 6 grupos musculares) y el efecto esperado sobre el rendimiento: la fatiga se acumula durante el pico de carga (semana 3) y, al ajustar el volumen, el cuerpo supercompensa por encima del punto de partida antes del siguiente bloque.</p>

  <div class="card">
    <div class="super-chart">${svg}</div>
    <div class="super-legend">
      <span class="lg-item"><span class="lg-swatch" style="background:#9fdcbd;"></span>Carga de entrenamiento (series promedio)</span>
      <span class="lg-item"><span class="lg-swatch" style="background:#00a86b;"></span>Rendimiento / supercompensación (ilustrativo)</span>
    </div>
    <p class="legend-note">La curva de rendimiento es un modelo ilustrativo derivado de la carga real del programa (no una medición biométrica): a mayor acumulación de carga, mayor caída temporal de rendimiento; al reducir volumen, el rendimiento se recupera por encima de la línea base.</p>
  </div>
  `;
}

function renderNutricion(){
  const n = DATA.nutrition;
  const mealRows = n.meals.map(m=>{
    const head = `<tr class="cat-row">
      <td class="num">${m.hora}</td>
      <td colspan="2">${m.nombre}</td>
      <td class="num">${m.kcal} kcal</td>
    </tr>`;
    const items = m.items.map(it=>`
      <tr>
        <td></td>
        <td colspan="2">${it.alimento}</td>
        <td class="num">${it.kcal} kcal</td>
      </tr>`).join('');
    const supl = m.supl ? `<tr><td></td><td colspan="2" class="muted">Suplementación: ${m.supl}</td><td></td></tr>` : '';
    return head + items + supl;
  }).join('');

  const macros = n.macros.map(m=>`
    <tr><td>${m.nombre}</td><td>${m.cantidad}</td><td class="num">${m.gramos}</td><td class="num">${m.kcal}</td></tr>
  `).join('');

  const mealChips = n.meals.map(m=>`<div class="chip-total">${m.hora}&nbsp;<b>${m.kcal}</b></div>`).join('');

  return `
  <h2 class="section-title">Plan de alimentación &middot; Agosto – Octubre</h2>
  <p class="section-desc">${n.meals.length} comidas al día (6:00 am a 9:00 pm) distribuidas alrededor del entrenamiento de las 12:00 pm, con el detalle de calorías por alimento. Objetivo: definición.</p>

  <div class="totals-row">
    <div class="chip-total">Total diario &nbsp;<b data-count="${n.totalKcal}">${n.totalKcal}</b>&nbsp;kcal</div>
    ${mealChips}
  </div>

  <div class="table-scroll wide" style="margin-bottom:22px;">
    <table>
      <thead><tr><th>Hora</th><th colspan="2">Comida / alimento</th><th>Kcal</th></tr></thead>
      <tbody>${mealRows}</tbody>
    </table>
  </div>

  <h3 class="section-title" style="font-size:16px;">Macronutrientes</h3>
  <div class="table-scroll">
    <table>
      <thead><tr><th>Macronutriente</th><th>Cantidad</th><th>Gramos</th><th>Calorías</th></tr></thead>
      <tbody>${macros}</tbody>
    </table>
  </div>
  `;
}

function isNaVal(v){ return v===null || v===undefined || (typeof v === 'string' && v.toLowerCase()==='na'); }

let exRowSeq = 0;

function matrixRowHTML(r, keyPrefix){
  const id = 'ex-'+keyPrefix+'-'+(exRowSeq++);
  const weekCells = WEEK_META.map(w=>{
    const pair = r[w.key];
    const sets = pair[0];
    if(isNaVal(sets)) return `<td class="num num-cell off">${fmtSet(pair)}</td>`;
    const ck = checkKey(keyPrefix, r.name) + '::' + w.key;
    const done = isChecked(ck);
    const label = `Marcar ${String(r.name).trim().replace(/"/g,'&quot;')} · ${w.label} como realizado`;
    return `<td class="num num-cell${done?' done':''}" onclick="event.stopPropagation()"><label class="wk-check"><input type="checkbox" class="ex-check" aria-label="${label}" data-ck="${ck}" data-wk="${w.key}" ${done?'checked':''} onchange="onExCheck(this)">${fmtSet(pair)}</label></td>`;
  }).join('');
  return `<tr class="ex-row" data-target="${id}" onclick="toggleExRow('${id}', this)">
      <td><span class="combo-badge">${r.combo||'·'}</span></td>
      <td class="ex-name-cell"><span class="ex-caret">&#9656;</span>${r.name}</td>
      ${weekCells}
    </tr>
    <tr class="ex-meta-row" id="${id}">
      <td colspan="${2+WEEK_META.length}">
        <div class="ex-meta-inline">
          <span><b>Tempo</b> ${r.tempo||'—'}</span>
          <span><b>RIR</b> ${(r.rir===null||r.rir===undefined)?'—':r.rir}</span>
          <span><b>Descanso</b> ${r.rest||'—'}</span>
        </div>
      </td>
    </tr>`;
}

const CHECK_STORE = 'tablero-lp-realizados-semana-v2';
let checkState = {};
try{ checkState = JSON.parse(localStorage.getItem(CHECK_STORE) || '{}') || {}; }catch(e){ checkState = {}; }
function saveChecks(){ try{ localStorage.setItem(CHECK_STORE, JSON.stringify(checkState)); }catch(e){} }
function checkKey(prefix, name){ return prefix + '::' + String(name||'').trim(); }
function isChecked(k){ return !!checkState[k]; }
function onExCheck(el){
  const k = el.dataset.ck;
  if(el.checked) checkState[k] = true; else delete checkState[k];
  saveChecks();
  const cell = el.closest('td'); if(cell) cell.classList.toggle('done', el.checked);
  updateCheckCounts();
}
function updateCheckCounts(){
  document.querySelectorAll('.panel').forEach(p=>{
    const bar = p.querySelector('.check-count'); if(!bar) return;
    bar.innerHTML = WEEK_META.map(w=>{
      const all = p.querySelectorAll(`.ex-check[data-wk="${w.key}"]`).length;
      const on = p.querySelectorAll(`.ex-check[data-wk="${w.key}"]:checked`).length;
      return `<span class="wk-count${all&&on===all?' full':''}">${w.key} <b>${on}</b>/${all}</span>`;
    }).join('');
  });
}
function resetChecks(btn){
  const panel = btn.closest('.panel'); if(!panel) return;
  panel.querySelectorAll('.ex-check').forEach(el=>{ delete checkState[el.dataset.ck]; el.checked=false; const cell=el.closest('td'); if(cell) cell.classList.remove('done'); });
  saveChecks(); updateCheckCounts();
}

function toggleExRow(id, rowEl){
  const meta = document.getElementById(id);
  if(meta) meta.classList.toggle('show');
  if(rowEl) rowEl.classList.toggle('open');
}

function matrixTableHTML(rows, keyPrefix){
  const weekHeads = WEEK_META.map(w=>`<th>${w.label.replace('Semana ','S')}</th>`).join('');
  return `<div class="table-scroll wide" style="margin-bottom:22px;">
    <table>
      <thead><tr><th></th><th>Ejercicio</th>${weekHeads}</tr></thead>
      <tbody>${rows.map(r=>matrixRowHTML(r, keyPrefix)).join('')}</tbody>
    </table>
  </div>`;
}

function renderMuscle(key){
  const t = DATA.totals[key];
  const rows = DATA.muscles[key];
  const rezagado = rows.filter(r=>r.cat==='Musculo Rezagado');
  const principal = rows.filter(r=>r.cat==='Musculo principal');
  const complementarios = rows.filter(r=>r.cat!=='Musculo Rezagado' && r.cat!=='Musculo principal');

  let tables = '';
  if(rezagado.length){
    tables += `<div class="cat-block-label">Músculo rezagado &middot; superserie A (igual todos los días)</div>`;
    tables += matrixTableHTML(rezagado, key+'-rz');
  }
  if(principal.length){
    tables += `<div class="cat-block-label">Músculo principal &middot; matriz semanas 1&ndash;4</div>`;
    tables += matrixTableHTML(principal, key+'-pr');
  }
  if(complementarios.length){
    tables += `<div class="cat-block-label">Accesorios</div>`;
    tables += matrixTableHTML(complementarios, key+'-ac');
  }

  return `
  <div class="muscle-head">
    <div>
      <h2 class="section-title">${MUSCLE_LABELS[key]||key}</h2>
      <p class="section-desc" style="margin-bottom:0;">Matriz de series&times;reps por semana. Toca una fila para ver tempo, RIR y descanso. Marca el recuadro de cada semana (S1–S4) conforme vayas realizando cada ejercicio. El músculo rezagado se entrena igual todos los días del bloque.</p>
      <div class="check-bar"><span class="check-count"></span><button type="button" class="check-reset" onclick="resetChecks(this)">Reiniciar marcas</button></div>
    </div>
  </div>

  <div style="margin:16px 0 24px 0;">${tables}</div>

  <div class="card">
    <h3>Series de músculo principal por semana</h3>
    <div class="chart-box"><div class="bars" id="chart-${key}"></div></div>
    <p class="legend-note">Semana 3 fijada en <b>36 series</b> (80% de carga, pico de volumen) y semana 4 ajustada a <b>${t.S4} series</b> con más variedad de ejercicios. No incluye la superserie de músculo rezagado (9 series fijas cada semana) ni accesorios.</p>
  </div>
  `;
}

const barColors = ['#a8e3c6','#9fdcbd','#00a86b','#0a4f39'];
function grayscaleChart(containerId, labels, values){
  const el = document.getElementById(containerId);
  if(!el) return;
  const max = Math.max(1, ...values);
  el.innerHTML = labels.map((label, i) => {
    const v = values[i];
    const pct = Math.round((v / max) * 100);
    const color = barColors[i % barColors.length];
    return `<div class="bar-col">
      <div class="bar-track"><div class="bar-fill" style="height:${pct}%;background:${color};"><span class="bar-value">${v}</span></div></div>
      <div class="bar-label">${label}</div>
    </div>`;
  }).join('');
}

function renderChartsFor(tabId){
  if(tabId==='resumen'){
    const labels = WEEK_META.map(w=>w.label.replace('Semana ','S'));
    // average across muscles for overview chart is less informative; show per-muscle grouped instead via simple total sum
    const sums = ['S1','S2','S3','S4'].map(wk => Object.values(DATA.totals).reduce((a,t)=>a+t[wk],0));
    grayscaleChart('chart-resumen', labels, sums);
  } else if(tabId.startsWith('m-')){
    const key = tabId.slice(2);
    const t = DATA.totals[key];
    const labels = WEEK_META.map(w=>w.label.replace('Semana ','S'));
    grayscaleChart('chart-'+key, labels, ['S1','S2','S3','S4'].map(k=>t[k]));
  }
}

function buildPanels(){
  const main = document.getElementById('mainContent');
  let html = '';
  html += `<div class="panel active" id="panel-resumen">${renderResumen()}</div>`;
  html += `<div class="panel" id="panel-nutricion">${renderNutricion()}</div>`;
  html += `<div class="panel" id="panel-progresion">${renderProgresion()}</div>`;
  Object.keys(DATA.muscles).forEach(key=>{
    html += `<div class="panel" id="panel-m-${key}">${renderMuscle(key)}</div>`;
  });
  main.innerHTML = html;
}

buildKpis();
buildTabs();
buildPanels();
updateCheckCounts();
renderChartsFor('resumen');
</script>
<script>
/* ===== ProTrainerPlus · íconos animados, líneas verdes y secciones desplegables (página de plan) ===== */
(function(){
  const P={
    home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    clip:'<rect x="8" y="2.5" width="8" height="4" rx="1.5"/><path d="M16 4.5h2a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
    apple:'<path d="M12 7.5c-2-2-6.2-1.4-6.6 2.6C5 14 7 19 9.5 20.4c1 .6 1.8 0 2.5 0s1.5.6 2.5 0C17 19 19 14 18.6 10.1 18.2 6.1 14 5.5 12 7.5z"/><path d="M12 7.5c0-2 1-3.6 3-4.5"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/>',
    userplus:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M19 8v6M16 11h6"/>',
    layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
    pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
    dumbbell:'<path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    flame:'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1.5 1.5 2 2.5 2 0-2.5-.5-4.5.5-7z"/>',
    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
    chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
    camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    db:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/>',
    key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>'
  };
  const svg=(k,cls)=>`<svg class="ico${cls?" "+cls:""}" viewBox="0 0 24 24" aria-hidden="true">${P[k]||P.dumbbell}</svg>`;
  const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  function pick(label,fallback){
    const t=norm(label);
    if(/nueva|alta|agregar/.test(t))return"userplus";
    if(/resumen|inicio/.test(t))return"home";
    if(/cuenta|perfil/.test(t))return"user";
    if(/funciona|ayuda/.test(t))return"layers";
    if(/seguimiento/.test(t))return"chat";
    if(/planes/.test(t))return"layers";
    if(/nutri|dieta|comida|menu|aliment/.test(t))return"apple";
    if(/historial/.test(t))return"clock";
    if(/registr|sesion de hoy|hoy/.test(t))return"check";
    if(/atleta|cliente/.test(t))return"users";
    if(/actividad|feed/.test(t))return"pulse";
    if(/progres|evoluc/.test(t))return"trend";
    if(/mi plan|plan/.test(t))return"clip";
    if(/semana|sesion|fecha|dia|enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre|mes/.test(t))return"cal";
    if(/kcal|calor|racha/.test(t))return"flame";
    if(/%|avance|cumpl|progreso|meta/.test(t))return"target";
    if(/foto|evidencia/.test(t))return"camera";
    if(/coment|mensaje|nota/.test(t))return"chat";
    if(/excel|subir|archivo/.test(t))return"upload";
    if(/contrase|acceso|credencial/.test(t))return"key";
    if(/datos|respaldo/.test(t))return"db";
    return fallback;
  }
  window.PTP={svg,pick};

  /* pestañas */
  function decorateTabs(){
    document.querySelectorAll("nav.tabs button, .tab-btn").forEach(b=>{
      if(b.querySelector(".ico"))return;
      const tn=b.firstChild;if(tn&&tn.nodeType===3)tn.textContent=tn.textContent.replace(/^\+\s*/,"");
      b.insertAdjacentHTML("afterbegin",svg(pick((b.dataset.tab||"")+" "+b.textContent,"dumbbell")));
    });
  }
  /* indicadores */
  function decorateKpis(){
    document.querySelectorAll(".kpi").forEach(k=>{
      if(k.querySelector(".k-ico"))return;
      const lab=(k.querySelector(".k-label")||{}).textContent||"";
      const inner=document.createElement("div");
      while(k.firstChild)inner.appendChild(k.firstChild);
      k.appendChild(inner);
      k.insertAdjacentHTML("afterbegin",`<span class="k-ico">${svg(pick(lab,"trend"),"lg")}</span>`);
    });
  }
  /* tarjetas con título → secciones desplegables */
  function decorateCards(root){
    (root||document).querySelectorAll(".card").forEach(c=>{
      if(c.classList.contains("acc")&&!c.querySelector(":scope>.acc-body"))c.classList.remove("acc","closed");
      if(c.classList.contains("acc")||c.classList.contains("click")||c.closest("nav"))return;
      const h=c.firstElementChild;
      if(!h||h.tagName!=="H3"||c.children.length<2)return;
      const k=pick(h.textContent,null);
      if(k&&!h.querySelector(".ico"))h.insertAdjacentHTML("afterbegin",svg(k));
      const body=document.createElement("div");body.className="acc-body";
      const inner=document.createElement("div");body.appendChild(inner);
      while(h.nextSibling)inner.appendChild(h.nextSibling);
      c.appendChild(body);c.classList.add("acc");
      h.setAttribute("role","button");h.tabIndex=0;h.setAttribute("aria-expanded","true");
      const tog=()=>{const closed=c.classList.toggle("closed");h.setAttribute("aria-expanded",String(!closed))};
      h.addEventListener("click",e=>{if(e.target.closest("button,a,input,select,textarea,label"))return;tog()});
      h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}});
    });
  }
  /* líneas verdes animadas del encabezado */
  function headerLines(){
    const h=document.querySelector("header.top, header.topbar");
    if(!h||h.querySelector(".hdr-lines"))return;
    h.insertAdjacentHTML("afterbegin",'<svg class="hdr-lines" viewBox="0 0 1200 260" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 200 C 220 120, 420 250, 640 170 S 1020 90, 1240 150"/><path d="M-20 230 C 260 170, 460 260, 700 205 S 1040 140, 1240 190"/><path d="M-20 60 C 300 110, 520 10, 820 70 S 1100 40, 1240 20"/></svg>');
  }
  let raf=0;
  function run(){raf=0;decorateTabs();decorateKpis();decorateCards();}
  function boot(){
    headerLines();run();
    if(!document.querySelector(".ptp-foot"))document.body.insertAdjacentHTML("beforeend",'<div class="ptp-foot">Plataforma <span class="ptp"><b>P</b>ro<b>T</b>rainer<b>P</b>lus</span></div>');
    new MutationObserver(()=>{if(!raf)raf=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
